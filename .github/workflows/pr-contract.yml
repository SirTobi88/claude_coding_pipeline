name: PR contract

# Everything here reads the PR description, the issue it closes and the list of
# changed files -- never the pull request's code. So it runs on
# `pull_request_target`: GitHub takes this workflow file, and the checkout
# below, from the DEFAULT branch. Under `pull_request` the workflow came from
# the pull request itself, and a pull request could rewrite the checks that
# judge it (docs/LESSONS.md § Merging). Do not add a step that checks out or
# runs the pull request's head: this event carries a token for the base
# repository.
#
# It re-runs on `edited` as well: fixing a description re-judges it without a
# new commit. The build/test jobs live in ci.yml and do not re-run on edits.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The allowlist is the most-cited rule in CONTRIBUTING-agents.md. It is
  # checked with the same .claude/hooks/lib/issue_scope.sh the edit-time guard
  # uses, because two implementations of "what does Files in scope mean" drift
  # silently and the drift only shows up as a correct PR being rejected. The
  # rules themselves are in .claude/hooks/lib/pr_allowlist.sh, where
  # .claude/hooks/test/run_tests.sh can reach them.
  allowlist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
      OWNER: ${{ github.repository_owner }}
      OWNER_TYPE: ${{ github.event.repository.owner.type }}
    steps:
      - name: Check out the default branch (never the pull request)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Files in scope
        run: |
          set -euo pipefail
          . .claude/hooks/lib/issue_scope.sh
          . .claude/hooks/lib/pr_allowlist.sh
          AGENT_LOGIN="$(python3 .claude/pipeline/pipeline.py config agent_login)"
          if [ -z "$AGENT_LOGIN" ]; then
            # On a personal repository the agents push as its owner. An
            # organisation is never a pull request's author, so there the
            # account must be named, or the agents' rules would never apply.
            if [ "$OWNER_TYPE" = "Organization" ]; then
              echo "::error::Set agent_login in .claude/pipeline/config.json: $OWNER is an organisation."
              exit 1
            fi
            AGENT_LOGIN="$OWNER"
          fi
          export AGENT_LOGIN
          export CONTROL_PATHS_FILE="$RUNNER_TEMP/control_paths"
          python3 .claude/pipeline/pipeline.py config control_paths | jq -r '.[]' | tr -d '\r' > "$CONTROL_PATHS_FILE"
          set +e
          pr_allowlist_check

  # The PR description's shape: the four sections of
  # .github/pull_request_template.md, each non-empty. Checked here so the
  # reviewer spends its time on the code rather than on bookkeeping.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Check out the default branch (never the pull request)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: PR description
        run: |
          set -euo pipefail
          gh pr view "$PR" --json body --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          python3 .claude/pipeline/pipeline.py check-pr-body < "$RUNNER_TEMP/body.md"
